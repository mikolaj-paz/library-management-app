name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build - Format - Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Remove -DskipTests once the Tester delivers test classes.
      - name: Compile
        run: mvn compile --no-transfer-progress -DskipTests

      # Fails if any .java file is not formatted according to Google Java Format.
      # Developers fix locally with: mvn spotless:apply
      - name: Check formatting (Spotless)
        run: mvn spotless:check --no-transfer-progress

      # Enforces naming conventions, import hygiene, and basic code quality rules.
      # See config/checkstyle/checkstyle.xml for the full rule set.
      - name: Lint (Checkstyle)
        run: mvn checkstyle:check --no-transfer-progress

